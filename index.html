<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9e1b1b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Bellas Pork City POS</title>

<style>
/* Layout: a counter tool. Sticky status bar (day, stock left, who is serving), one task per tab, bottom tab bar on phones. */
:root{
  --bg:#f7f3f1; --panel:#ffffff; --ink:#22292d; --muted:#5d666b; --line:#e3dbd7; --soft:#efe7e3;
  --red:#9e1b1b; --red-ink:#ffffff; --char:#36454f; --char-ink:#ffffff;
  --ok:#1f6b45; --ok-bg:#e3f2e9; --warn:#8a5300; --warn-bg:#fdf0d8; --bad:#a1161a; --bad-bg:#fbe3e2;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body:"Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171a1c; --panel:#20262a; --ink:#ece8e6; --muted:#a3a9ad; --line:#353d42; --soft:#2a3136;
  --red:#d5544c; --red-ink:#1a0f0e; --char:#9fb2bf; --char-ink:#13181b;
  --ok:#7fd3a3; --ok-bg:#1d3328; --warn:#f2c06b; --warn-bg:#3a2e17; --bad:#ff8f87; --bad-bg:#40201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a1c; --panel:#20262a; --ink:#ece8e6; --muted:#a3a9ad; --line:#353d42; --soft:#2a3136;
  --red:#d5544c; --red-ink:#1a0f0e; --char:#9fb2bf; --char-ink:#13181b;
  --ok:#7fd3a3; --ok-bg:#1d3328; --warn:#f2c06b; --warn-bg:#3a2e17; --bad:#ff8f87; --bad-bg:#40201f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.word{font-family:var(--f-display);font-size:1.25rem;color:var(--red);letter-spacing:.01em}
.word small{display:block;font:600 .72rem/1.2 var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.banner{padding:10px 12px;border-radius:var(--r);font-weight:600;font-size:.95rem}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.info{background:var(--soft);color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{flex:1 0 auto}
@media (max-width:700px){.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}}
@media (max-width:700px){.tab{padding:10px 8px!important;font-size:.85rem!important}}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:700 .9rem var(--f-body);padding:10px 12px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--char);color:var(--char-ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label{display:grid;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
label.check{display:flex;gap:10px;align-items:flex-start;font-size:1rem;color:var(--ink);font-weight:600}
label.check input{width:22px;height:22px;margin-top:1px;flex:none;accent-color:var(--red)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:64px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 1rem var(--f-body);padding:11px 16px;border-radius:8px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.dark{background:var(--char);border-color:var(--char);color:var(--char-ink)}
.btn.small{min-height:34px;padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px;min-height:86px;cursor:pointer;display:grid;align-content:space-between;gap:6px;color:var(--ink);font:inherit}
.tile b{font:700 1.05rem var(--f-display)}
.tile span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.hero{grid-column:span 2;background:var(--red);border-color:var(--red);color:var(--red-ink);min-height:110px}
.tile.hero span{color:inherit;opacity:.85} .tile.hero b{font-size:1.4rem}
.tile.off{opacity:.55}
.tile.side{min-height:64px}
.section-label{font:700 .75rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.line .x{appearance:none;border:0;background:none;color:var(--bad);font-weight:700;cursor:pointer;padding:4px 8px}
.total{font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.receipt{font:13px/1.35 var(--f-mono);white-space:pre;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;overflow-x:auto;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--ink);font:700 .9rem var(--f-body);padding:10px 14px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--char);color:var(--char-ink)}
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:grid;align-items:end;justify-items:center;padding:12px max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px))}
@media (min-width:701px){.sheet{align-items:center}}
.sheet .panel{width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{min-height:56px;font-size:1.3rem}
.dots{font:700 1.6rem var(--f-mono);letter-spacing:.4em;text-align:center;min-height:2rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.err{color:var(--bad);font-weight:600}
.note{border-left:3px solid var(--char);padding:4px 0 4px 10px;font-size:.92rem}
.bio{border-left-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.tile:active,.btn:active{transform:scale(.98)}}
#print-area{display:none}
@media print{body{padding:0;background:#fff}body>*:not(#print-area){display:none!important}#print-area{display:block;font:11px/1.25 "IBM Plex Mono",monospace;color:#000;margin:0;white-space:pre}#print-area.w32{width:58mm}#print-area.w48{width:80mm}@page{margin:2mm}}
</style>

<div class="wrap">
  <header class="top" id="top">
    <div class="brand">
      <div class="word">Bellas Pork City<small>Counter · Kithino</small></div>
      <div class="stat" id="stat"><span class="chip">Connecting…</span></div>
    </div>
    <div id="banners"></div>
    <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  </header>
  <main id="view" class="wrap"><div class="panel"><h2>Opening the counter</h2><p class="muted">Loading today's sales, stock and staff list. If this takes more than a few seconds, check the phone's internet.</p></div></main>
</div>
<div id="sheet"></div>
<pre id="print-area" aria-hidden="true"></pre>

<script>
/* Fonts load in the background so a slow connection never holds up the counter screen. */
(function () { try { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"; document.head.appendChild(l); } catch (e) { } })();
/* Bellas Pork City POS — pure logic (no DOM, no network). Tested in node by test.js.
   Every figure here comes from Christabel's confirmed price list (19 Oct 2026) or her daily reports. */
(function (root) {
  "use strict";

  // ---------- catalogue (defaults; the Owner can change prices in Settings, each change is logged)
  var ITEMS = {
    porkugali: { key: "porkugali", name: "Pork ugali", short: "Pork ugali", kind: "kg", price: 150, per: "100 g", perKg: 1500,
      pork: true, line: "Kitchen", offer: true, note: "Per 100 g of pork, weighed raw. Ugali portion included." },
    fresh:   { key: "fresh", name: "Fresh pork", short: "Fresh pork", kind: "kg", price: 700, per: "kg", perKg: 700, pork: true, line: "Butchery" },
    premium: { key: "premium", name: "Premium cuts", short: "Premium cuts", kind: "kg", price: 800, per: "kg", perKg: 800, pork: true, line: "Butchery",
      note: "Ribs, lean chops, skinless cuts" },
    cooked:  { key: "cooked", name: "Cooked pork", short: "Cooked pork", kind: "kg", price: 700, per: "kg (raw)", perKg: 700, pork: true, line: "Kitchen",
      note: "Weigh raw, before cooking" },
    platter: { key: "platter", name: "Pork platter", short: "Platter", kind: "each", price: 1200, per: "platter", porkKgEach: 1, pork: true, line: "Kitchen",
      note: "1 kg of pork, weighed raw" },
    mukimo:  { key: "mukimo", name: "Mukimo", kind: "side", line: "Side" },
    chips:   { key: "chips", name: "Chips", kind: "side", line: "Side" },
    ugali:   { key: "ugali", name: "Ugali", kind: "side", line: "Side" },
    veg:     { key: "veg", name: "Vegetables", kind: "side", line: "Side" }
  };
  var SIDES = ["mukimo", "chips", "ugali", "veg"];
  var PORTIONS = ["100g", "300g", "500g", "1kg"];
  var PORTION_LABEL = { "100g": "100 g", "300g": "300 g", "500g": "500 g", "1kg": "1 kg" };
  // KES per portion (Christabel, 19 Oct 2026)
  var SIDE_PRICES = {
    mukimo: { "100g": 20, "300g": 50, "500g": 100, "1kg": 100 },
    chips:  { "100g": 20, "300g": 50, "500g": 100, "1kg": 100 },
    ugali:  { "100g": 20, "300g": 50, "500g": 50,  "1kg": 100 },
    veg:    { "100g": 20, "300g": 50, "500g": 50,  "1kg": 100 }
  };

  var DEFAULT_SETTINGS = {
    prices: { porkugali: 150, fresh: 700, premium: 800, cooked: 700, platter: 1200 },
    sidePrices: SIDE_PRICES,
    rounding: "nearest1",          // not decided yet (Christabel, 19 Oct 2026): exact to the shilling, computed amount kept too
    cashGapLimit: 50,              // suggested, not confirmed
    stockGapLimit: 0.2,            // suggested, not confirmed
    openingDiffLimit: 0.2,
    sidesWithoutPork: false,       // Christabel, 19 Oct 2026: sides only with pork
    standalonePrices: null,        // not decided
    disposal: ["Pit", "Burn", "Bin collection"], // which one the shop uses is not confirmed
    suppliers: ["John Nabea", "Faith Mpara", "Peter Kajogo", "Gitonga"],
    salary: { chef: 500, farmhand: 200 },
    floatKes: null                 // not confirmed
  };

  var EXPENSE_CATS = [
    { key: "Unga", centre: "Pork City" }, { key: "Sukuma", centre: "Pork City" }, { key: "Cooking oil", centre: "Pork City" },
    { key: "Tomatoes", centre: "Pork City" }, { key: "Lunch", centre: "Pork City" }, { key: "Transport", centre: "Pork City" },
    { key: "Soap", centre: "Pork City" }, { key: "Salt", centre: "Pork City" }, { key: "Savete", centre: "Pork City" },
    { key: "Vet (meat inspection)", centre: "Pork City" },
    { key: "Feeds transport", centre: "Farm (paid by Pork City)" }, { key: "Pig feed", centre: "Farm (paid by Pork City)" },
    { key: "Peas for pigs", centre: "Farm (paid by Pork City)" }, { key: "Other", centre: null }
  ];
  var FARM = "Farm (paid by Pork City)";

  // ---------- numbers
  function r3(x) { return Math.round((+x || 0) * 1000) / 1000; }
  function r2(x) { return Math.round((+x || 0) * 100) / 100; }
  function kes(x) { var n = Math.round(+x || 0); return (n < 0 ? "-" : "") + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function kg3(x) { return (+x || 0).toFixed(3); }
  function kgShort(x) { return String(r3(x)); }
  function applyRounding(amount, rule) {
    if (rule === "down10") return Math.floor(amount / 10 + 1e-9) * 10;
    if (rule === "nearest10") return Math.round(amount / 10) * 10;
    return Math.round(amount);
  }
  function perKg(itemKey, settings) {
    var p = (settings && settings.prices) || DEFAULT_SETTINGS.prices;
    if (itemKey === "porkugali") return p.porkugali * 10;
    return p[itemKey];
  }

  // ---------- lines
  function lineFromKg(itemKey, kg, settings) {
    kg = r3(kg);
    if (!(kg > 0)) throw new Error("Enter the weight in kg");
    var it = ITEMS[itemKey], pk = perKg(itemKey, settings);
    var computed = r2(kg * pk);
    return { item: itemKey, name: it.name, kg: kg, qty: null, unitPrice: itemKey === "porkugali" ? settings.prices.porkugali : pk,
      unit: it.per, computed: computed, charged: applyRounding(computed, settings.rounding), stockKg: kg, pork: true, entry: "kg" };
  }
  function lineFromKes(itemKey, amount, settings) {
    amount = Math.round(+amount);
    if (!(amount > 0)) throw new Error("Enter the amount in KES");
    var it = ITEMS[itemKey], pk = perKg(itemKey, settings);
    var kg = r3(amount / pk);
    return { item: itemKey, name: it.name, kg: kg, qty: null, unitPrice: itemKey === "porkugali" ? settings.prices.porkugali : pk,
      unit: it.per, computed: amount, charged: amount, stockKg: kg, pork: true, entry: "kes" };
  }
  function platterLine(qty, settings) {
    qty = Math.round(+qty || 1);
    var p = settings.prices.platter;
    return { item: "platter", name: "Pork platter", kg: null, qty: qty, unitPrice: p, unit: "platter",
      computed: qty * p, charged: qty * p, stockKg: r3(qty * ITEMS.platter.porkKgEach), pork: true, entry: "qty" };
  }
  // Basis for side portions: pork kg of cooked, fresh and premium lines; if none, pork ugali kg
  // (ugali side then not allowed: pork ugali already includes its ugali).
  function sideBasis(lines) {
    var k = 0, u = 0;
    lines.forEach(function (l) {
      if (l.item === "cooked" || l.item === "fresh" || l.item === "premium") k += l.stockKg;
      if (l.item === "porkugali") u += l.stockKg;
    });
    k = r3(k); u = r3(u);
    if (k > 0) return { kg: k, from: "pork", ugaliAllowed: true };
    if (u > 0) return { kg: u, from: "porkugali", ugaliAllowed: false };
    return { kg: 0, from: null, ugaliAllowed: true };
  }
  // Under 300 g -> 100 g; 300-499 g -> 300 g; 500-999 g -> 500 g; exactly 1 kg -> 1 kg.
  // Above 1 kg: staff choose (Christabel, 19 Oct 2026), so no suggestion.
  function suggestPortion(kg) {
    kg = r3(kg);
    if (!(kg > 0)) return null;
    if (kg < 0.3) return "100g";
    if (kg < 0.5) return "300g";
    if (kg < 1) return "500g";
    if (kg === 1) return "1kg";
    return null;
  }
  function sideLine(side, portion, settings, suggested) {
    var price = settings.sidePrices[side][portion];
    return { item: side, name: ITEMS[side].name, kg: null, qty: 1, portion: portion, unitPrice: price, unit: PORTION_LABEL[portion] + " portion",
      computed: price, charged: price, stockKg: 0, pork: false, entry: "portion",
      suggested: suggested || null, changed: suggested ? suggested !== portion : false };
  }
  function canAddSide(side, lines, settings) {
    var b = sideBasis(lines);
    if (b.kg === 0 && !settings.sidesWithoutPork) return { ok: false, why: "Sides are sold only with pork. Add the pork first." };
    if (side === "ugali" && !b.ugaliAllowed) return { ok: false, why: "Pork ugali already includes ugali. Do not add a separate ugali side." };
    return { ok: true, basis: b };
  }

  function cartTotals(lines) {
    var t = { porkKg: 0, porkKes: 0, foodKes: 0, total: 0, computed: 0, roundingDiff: 0 };
    lines.forEach(function (l) {
      t.total += l.charged; t.computed += l.computed;
      if (l.pork) { t.porkKg += l.stockKg; t.porkKes += l.charged; } else t.foodKes += l.charged;
    });
    t.porkKg = r3(t.porkKg); t.computed = r2(t.computed); t.roundingDiff = r2(t.total - t.computed);
    return t;
  }

  // ---------- payments
  function normCode(c) { return String(c || "").trim().toUpperCase().replace(/\s+/g, ""); }
  function validCode(c) { return /^[A-Z0-9]{10}$/.test(normCode(c)); }
  function checkPayments(payments, total, usedCodes) {
    var errs = [], sum = 0, seen = {}, change = 0;
    if (!payments.length) errs.push("Choose how the customer paid.");
    payments.forEach(function (p) {
      var amt = Math.round(+p.amount || 0);
      if (!(amt > 0)) errs.push(p.type + ": enter the amount.");
      if (p.type === "Till" || p.type === "M-Pesa") {
        var c = normCode(p.code);
        if (!validCode(c)) errs.push(p.type + ": the transaction code must be 10 letters and digits (e.g. UJFEUAQL0V).");
        else if (seen[c] || (usedCodes && usedCodes[c])) errs.push("Code " + c + " has already been used. Check the customer's message.");
        seen[c] = 1;
      }
      sum += amt;
    });
    var cash = payments.filter(function (p) { return p.type === "Cash"; });
    var nonCash = sum - cash.reduce(function (a, p) { return a + Math.round(+p.amount || 0); }, 0);
    if (nonCash > total) errs.push("Till / M-Pesa amounts are more than the total.");
    if (sum < total) errs.push("KES " + kes(total - sum) + " still to pay.");
    if (sum > total) {
      if (cash.length) change = sum - total; else errs.push("Payments are more than the total.");
    }
    return { ok: errs.length === 0, errors: errs, paid: sum, change: change };
  }
  // The amount each payment type actually keeps (cash net of change)
  function paymentsNet(sale) {
    var o = { Till: 0, "M-Pesa": 0, Cash: 0 };
    (sale.payments || []).forEach(function (p) { o[p.type] = (o[p.type] || 0) + Math.round(+p.amount || 0); });
    o.Cash -= (sale.change || 0);
    return o;
  }

  // ---------- day
  function live(list) { return (list || []).filter(function (x) { return !x.void; }); }
  function stockMeatIn(m) { return m.inOpening ? 0 : r3(m.kg); }
  function meatKg(m) { return r3(m.kg); }

  function dayTotals(day, sales, expenses, meatin, waste) {
    var S = live(sales), E = live(expenses), M = live(meatin), W = live(waste);

  }

      '<section class="panel"><h2>Pigs available for Meat in</h2><p class="small">' + (pl.length ? esc(pl.filter(function (p) { return p.role !== "Hired boar"; }).map(function (p) { return p.tag; }).join(", ")) : "None loaded yet.") + '</p><p class="small muted">Copied from Bellas Farm Office' + (pigDoc && pigDoc.copiedAt ? " on " + esc(pigDoc.copiedAt) : "") + ". Farm Office stays the record for every pig; the nightly update refreshes this list and marks slaughtered pigs there.</p></section>" +
      '<section class="panel"><h2>This phone</h2><dl class="kv"><dt>Google Sheet</dt><dd>' + (S.conn ? "connected" : "not connected") + '</dd><dt>Last synced</dt><dd>' + esc(S.lastSync ? new Date(S.lastSync).toLocaleString("en-GB", { timeZone: "Africa/Nairobi" }) : "never") + '</dd><dt>Waiting to send</dt><dd>' + S.queue.length + '</dd></dl>' +
      (S.conn ? '<label>Setup link for another phone (send it on WhatsApp; anyone with it can add records)<input id="setup-link" readonly value="' + esc(location.origin + location.pathname + "#setup=" + encodeURIComponent(S.conn.url + "|" + S.conn.key)) + '"></label><div class="row"><button class="btn" data-act="copy-setup">Copy setup link</button><button class="btn" data-act="disconnect">Disconnect this phone</button></div>' : "") + "</section>";
  }
  function savePrices(e) {
    e.preventDefault(); var s = settings(), cur = Object.assign({}, one("config", "settings") || {}), changes = [];
    var prices = {}; Object.keys(s.prices).forEach(function (k) { var v = Math.round(+$("#p-" + k).value); prices[k] = v; if (v !== s.prices[k]) changes.push(k + " " + s.prices[k] + " → " + v); });
    var sp = {}; P.SIDES.forEach(function (k) { sp[k] = {}; P.PORTIONS.forEach(function (p) { var v = Math.round(+$("#sp-" + k + "-" + p).value); sp[k][p] = v; if (v !== s.sidePrices[k][p]) changes.push(k + " " + p + " " + s.sidePrices[k][p] + " → " + v); }); });
    if (!changes.length) { flash("No price changed.", "info"); renderView(); return; }
    cur.prices = prices; cur.sidePrices = sp; cur.priceLog = (cur.priceLog || []).concat([{ at: now().iso, by: S.who.name, changes: changes }]);
    write("config", "settings", cur); audit("Prices changed", "", changes.join("; ")); flash("Prices saved: " + changes.join("; "), "ok"); renderView();
  }
  function saveRules(e) {
    e.preventDefault(); var cur = Object.assign({}, one("config", "settings") || {}), s = settings();
    if ($("#r-sides").checked && !s.standalonePrices) { flash("Selling sides without pork needs stand-alone prices first. Tell Claude the prices and this is switched on.", "warn"); renderView(); return; }
    cur.rounding = $("#r-round").value; cur.cashGapLimit = +$("#r-cash").value; cur.stockGapLimit = +$("#r-stock").value; cur.paperWidth = +$("#r-width").value; cur.sidesWithoutPork = $("#r-sides").checked;
    cur.disposal = Array.prototype.filter.call(document.querySelectorAll("[data-disp]"), function (x) { return x.checked; }).map(function (x) { return x.getAttribute("data-disp"); });
    if (!cur.disposal.length) { flash("Choose at least one disposal method.", "warn"); renderView(); return; }
    write("config", "settings", cur); audit("Rules changed", "", JSON.stringify({ rounding: cur.rounding, cash: cur.cashGapLimit, stock: cur.stockGapLimit, disposal: cur.disposal, width: cur.paperWidth })); flash("Rules saved.", "ok"); renderView();
  }

  // ------------------------------------------------------------------ files
  async function saveFile(name, text) {
    try {
      var a = document.createElement("a"), url = URL.createObjectURL(new Blob([text], { type: /\.csv$/.test(name) ? "text/csv" : "text/plain" }));
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    } catch (e) { alertSheet("The file was not saved on this phone."); }
  }
  function copy(text, btn) {
    var done = function () { if (btn) { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1500); } };
    try { navigator.clipboard.writeText(text).then(done, function () { selectFallback(); }); } catch (e) { selectFallback(); }
    function selectFallback() { var el = $("#sheet .receipt"); if (!el) return; var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); if (btn) btn.textContent = "Selected: copy it"; }
  }
  function csvDays() {
    var rows = [["date", "status", "opening_kg", "meat_in_stock_kg", "farm_kg", "bought_kg", "bought_kes", "sold_kg", "pork_kes", "food_kes", "expenses_kes", "net_kes", "till_kes", "mpesa_kes", "cash_kes", "money_recorded_kes", "money_gap_kes", "closing_kg", "stock_gap_kg", "waste_kg", "farm_costs_kes", "pork_ugali_offer", "pork_ugali_kg", "pork_ugali_kes", "rounding_diff_kes", "sales", "closed_by"]];
    all("days").sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (d) { var t = totalsFor(d); rows.push([d.date, d.status, d.openingKg, t.meatInStock, t.farmKg, t.boughtKg, t.boughtKes, t.soldKg, t.porkKes, t.foodKes, t.expensesKes, t.net, t.till, t.mpesa, t.cashNet, t.recorded, t.cashGap, d.closingKg, t.stockGap, t.wasteKg, t.farmCostsKes, d.offer ? "Y" : "N", t.ugaliKg, t.ugaliKes, t.roundingDiff, t.saleCount, d.closedBy || ""]); });
    saveFile("bellas-pork-city-days.csv", P.csv(rows));
  }
  function csvSales() {
    var rows = [["date", "time", "receipt", "void", "item", "kg", "qty", "portion", "unit_price", "computed_kes", "charged_kes", "payments", "codes", "served_by"]];
    all("sales").sort(function (a, b) { return a.at < b.at ? -1 : 1; }).forEach(function (s) { (s.lines || []).forEach(function (l) { rows.push([s.date, s.time, s.receiptNo, s.void ? "Y" : "", l.name, l.kg, l.qty, l.portion || "", l.unitPrice, l.computed, l.charged, (s.payments || []).map(function (p) { return p.type + " " + p.amount; }).join(" + "), (s.payments || []).map(function (p) { return p.code || ""; }).join(" "), s.byName]); }); });
    saveFile("bellas-pork-city-sales.csv", P.csv(rows));
  }

  // ------------------------------------------------------------------ events
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-tab]"); if (t && !t.closest("#sheet")) { S.tab = t.getAttribute("data-tab"); renderAll(); return; }
    var a = e.target.closest("[data-act]"); if (!a) return;
    var act = a.getAttribute("data-act"), id = a.getAttribute("data-id"), day = openDay();
    switch (act) {
      case "lock": audit("Signed out", S.who && S.who.name); S.who = null; ls(SKEY, null); S.cart = []; S.pay = []; renderAll(); break;
      case "pick-user": signIn(one("users", id)); break;
      case "seed-users":
        [["u-christabel", "Christabel", "owner", 1], ["u-kangai", "Kangai", "cashier", 2], ["u-doris", "Mama Doris (Doris Nehemiah)", "manager", 3]].forEach(function (u) { if (!one("users", u[0])) write("users", u[0], { name: u[1], role: u[2], order: u[3], active: true }); });
        audit("Staff list created", "", "Christabel (owner), Kangai (cashier), Mama Doris (manager)"); renderAll(); break;
      case "close-sheet": closeSheet(); break;
      case "add": readPayInputs(); readCustomer(); addItem(a.getAttribute("data-item"), day); break;
      case "rm": readPayInputs(); readCustomer(); S.cart.splice(+a.getAttribute("data-i"), 1); renderView(); break;
      case "clear": S.cart = []; S.pay = []; S.customer = {}; renderView(); break;
      case "addpay": readPayInputs(); readCustomer(); var ct = P.cartTotals(S.cart), paid = S.pay.reduce(function (x, p) { return x + Math.round(+p.amount || 0); }, 0); S.pay.push({ type: a.getAttribute("data-t"), amount: Math.max(0, ct.total - paid) || "", code: "" }); renderView(); break;
      case "rmpay": readPayInputs(); S.pay.splice(+a.getAttribute("data-i"), 1); renderView(); break;
      case "complete": completeSale(day); break;
      case "show-receipt": var s = one("sales", id); showReceipt(s, true, false); break;
      case "void": voidSale(id); break;
      case "copy-receipt": copy(S.receiptText, a); break;
      case "save-receipt": saveFile(S.receiptFile, S.receiptText); break;
      case "copy-setup": var el = $("#setup-link"); try { navigator.clipboard.writeText(el.value).then(function () { a.textContent = "Copied"; }, function () { el.select(); }); } catch (e) { el.select(); } break;
      case "print-receipt": var pa = $("#print-area"); pa.textContent = S.receiptText; pa.className = "w" + (settings().paperWidth || 32); window.print(); break;
      case "connect": var cu = $("#cn-url").value.trim(), ck = $("#cn-key").value.trim();
        if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(cu)) { $("#cn-err").textContent = "That is not a Google Apps Script web app address (it ends in /exec)."; break; }
        if (ck.length < 16) { $("#cn-err").textContent = "Enter the shop key from the setup message."; break; }
        S.conn = { url: cu, key: ck }; ls(CONN_KEY, S.conn); S.ready = false; renderAll(); pull(); flush(); break;
      case "disconnect": approve("owner", "Disconnecting this phone from the Google Sheet. Records not yet sent stay on the phone.", function () { S.conn = null; ls(CONN_KEY, null); S.lastPullTime = null; renderAll(); }); break;
      case "copy-report": copy(S.reportText, a); break;
      case "report": var d = one("days", id); if (d.report) showReport(d); else alertSheet("This day has no report yet. It is made when the day is closed."); break;
      case "reopen": reopen(id); break;
      case "offer-on": closeSheet(); approve("manager", "Switching on the pork ugali offer for today.", function (by) { write("days", day.date, Object.assign({}, day, { offer: true, offerBy: by.name, offerAt: now().iso })); audit("Pork ugali offer on", day.date, "by " + by.name); renderAll(); }); break;
      case "void-exp": approve("manager", "Voiding an expense.", function () { voidExp(id); }); break;
      case "check-close": day._draft = readCloseDraft(day); drafts[day.date] = day._draft; renderView(); break;
      case "recon": reconSheet(id); break;
      case "csv-days": csvDays(); break;
      case "csv-sales": csvSales(); break;
      case "set-pin": setPinFlow(one("users", id), false); break;
      case "toggle-user": var u = one("users", id); write("users", id, Object.assign({}, u, { active: u.active === false })); audit(u.active === false ? "Staff turned on" : "Staff turned off", u.name); renderView(); break;
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "offer-toggle") {
      var day = openDay(), on = e.target.checked;
      write("days", day.date, Object.assign({}, day, { offer: on, offerBy: S.who.name, offerAt: now().iso })); audit("Pork ugali offer " + (on ? "on" : "off"), day.date); renderAll();
    }
    if (e.target.id === "x-cat" || e.target.id === "x-pigfarm") expCatChange();
    if (e.target.id === "m-sup") $("#m-sup-new-l").hidden = e.target.value !== "__new";
    if (e.target.id === "m-live" || e.target.id === "m-carc") { var dr = P.dressing(+$("#m-live").value, +$("#m-carc").value); $("#m-dress").textContent = dr ? "Dressing " + dr + "% (carcass ÷ live)." : ""; }
  });
  document.addEventListener("input", function (e) { if (e.target.id === "find") $("#found").innerHTML = findReceipts(e.target.value); if (e.target.id === "o-kg") { var prev = lastClosed(); $("#o-why-l").hidden = !(prev && Math.abs(+e.target.value - prev.closingKg) > settings().openingDiffLimit); } });
  document.addEventListener("submit", function (e) {
    var id = e.target.id;
    if (id === "f-open") submitOpen(e); else if (id === "f-meat") submitMeat(e); else if (id === "f-waste") submitWaste(e);
    else if (id === "f-exp") submitExp(e); else if (id === "f-close") submitClose(e); else if (id === "f-prices") savePrices(e); else if (id === "f-rules") saveRules(e);
    else if (id === "f-adduser") { e.preventDefault(); var n = $("#u-name").value.trim(); if (!n) return; var uidv = "u-" + n.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 20) + "-" + uid().slice(-4); write("users", uidv, { name: n, role: $("#u-role").value, order: 5, active: true }); audit("Staff added", n, $("#u-role").value); renderView(); }
  });
  // meat-in source toggle + settings select values after render
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-src]"); if (!b) return;
    var farm = b.getAttribute("data-src") === "farm"; $("#m-farm").hidden = !farm; $("#m-bought").hidden = farm;
    document.querySelectorAll("[data-src]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
  });
  var _rv = renderView;
  renderView = function () {
    var day = openDay(); if (day && drafts[day.date]) day._draft = drafts[day.date];
    if ($("[data-pay]")) readPayInputs();
    if ($("#c-name")) readCustomer();
    if (day && $("#c-kg")) { drafts[day.date] = readCloseDraft(day); day._draft = drafts[day.date]; }
    dirty = false; pendingRender = false;
    _rv();
    var s = settings();
    if ($("#r-round")) $("#r-round").value = s.rounding;
    if ($("#r-width")) $("#r-width").value = String(s.paperWidth || 32);
    if ($("#x-cat")) expCatChange();
    if (day && day._draft && $("#h-how")) $("#h-how").value = day._draft.handover.method;
  };
  // openDay() returns a fresh object each call, so close-day drafts live in `drafts`
  var _openDay = openDay;
  openDay = function () { var d = _openDay(); if (d && drafts[d.date]) d._draft = drafts[d.date]; return d; };
})();

</script>
</body></html>
